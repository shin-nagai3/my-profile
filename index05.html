<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>遅麺畑大学</title>
  </head>



  <body>


    <header class="bg-white shadow px-6 py-4">
    
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between">
            <h1 class="text-xl font-bold text-blue-700 mr-6">遅麺畑大学</h1>


            <nav class="flex flex-col md:flex-row gap-1 md:gap-6 text-sm mt-2">
                <a href="#" class="text-gray-700 font-bold hover:scale-105 transition">About</a>
                <a href="#" class="text-gray-700 font-bold hover:scale-105 transition">Facebook</a>
                <a href="#" class="text-gray-700 font-bold hover:scale-105 transition">Contact</a>
            </nav>
        </div>

    </header>


    <main class="max-w-4xl mx-auto px-6 py-10">

        <section class="mb-14 text-center">
            <p class="text-3xl text-blue-700 font-bold">一昔前の伝統と校風</p>
            <p class="text-gray-600 text-lg mt-6">変わり行く遅麺畑、変わらない遅麺畑、そして知られざる遅麺畑。愛すべき遅麺畑の魅力をお伝えします。</p>
        </section>

        <section class="mb-10">

            <h2 class="text-blue-800 text-2xl font-bold b4-4">遅麺畑大学教旨</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">🐢</p>
                    <h3 class="font-bold text-lg">学問の従属</h3>
                    <p class="text-gray-500 text-sm mt-1">権力や時世に合わせながら、文学的に教育・研究を行ってきました。</p>
                </div>
                <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">🍜</p>
                    <h3 class="font-bold text-lg">学問の死蔵</h3>
                    <p class="text-gray-500 text-sm mt-1">「退嬰の肉体」として遅麺畑の大きな柱の一つになりました。</p>
                </div>
                <div class="bg-white rounded-lg shadow p-4 hover:shadow-lg transition">
                    <p class="text-2xl mb-2">🌱</p>
                    <h3 class="font-bold text-lg">悪例村民の造就</h3>
                    <p class="text-gray-500 text-sm mt-1">遅麺畑人がひとしく身につける校風です</p>
                </div>
            </div>

        </section>

    </main>


    <footer class="bg-blue-950 text-gray-400 text-sm text-center py-6">
        &copy; 2026 遅麺畑大学
    </footer>


  </body>

</html>
