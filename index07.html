<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>BMI計算</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>



    <body class="bg-gray-100 flex items-center justify-center min-h-screen p-2">


        <div class="bg-white rounded-xl shadow p-8">
            <h1 class="text-3xl text-blue-950 font-bold mb-6">TODOリスト</h1>

            <div class="flex gap-2 mb-6">
                <input id="todoInput" type="text" placeholder="ToDo入力欄"
                       class="border border-gray-300 rounded p-4">
                <button id="addBtn"
                        class="bg-blue-800 text-white font-bold p-4 rounded hover:bg-blue-600 transition">
                    追加
                </button>
            </div>

            <ul id="todoList" class="space-y-2"></ul>
        </div>

        <script>
            const addButton = document.querySelector("#addBtn");
            const todoInput = document.querySelector("#todoInput");
            const todoList = document.querySelector("#todoList");

            addButton.addEventListener("click", () => {
                const text = todoInput.value;

                if (text === "") {
                    return;
                }

                const item = document.createElement("li");
                item.className = "flex items-center justify-between bg-blue-50 rounded-lg px-3 py-2";

                const span = document.createElement("span");
                span.textContent = text;

                const buttonGroup = document.createElement("div");
                buttonGroup.className = "flex items-center gap-2";

                const doneBtn = document.createElement("button");
                doneBtn.textContent = "完了";
                doneBtn.className = "text-sm text-gray-800 hover:text-orange-600";

                doneBtn.addEventListener("click", () => {
                    span.classList.toggle("line-through");
                    span.classList.toggle("text-orange-400");
                });

                                const deleteBtn = document.createElement("button");
                deleteBtn.textContent = "削除";
                deleteBtn.className =
                    "text-sm text-orange-800 hover:text-orange-950";

                deleteBtn.addEventListener("click", () => {
                    const shouldDelete = confirm(
                        "このタスクを削除しますか？"
                    );

                    if (shouldDelete) {
                        item.remove();
                    }
                });

                buttonGroup.appendChild(doneBtn);
                buttonGroup.appendChild(deleteBtn);

                item.appendChild(span);
                item.appendChild(buttonGroup);

                todoList.appendChild(item);

                todoInput.value = "";
            });
        </script>


    </body>
</html>
