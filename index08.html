<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>チームメンバー一覧</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>



    <body class="bg-blue-50 p-10">
        <header class="flex justify-center">
            <h1 class="text-4xl font-bold mt-2 mb-6">チームメンバー紹介✌️</h1>
        </header>
        <div id="memberList" class="grid gap-4"></div>

    
        <script>
            const members = [
                { name: "千葉船子", role: "料理担当", comment: "煮込み料理をよく作ります" },
                { name: "埼玉たま男", role: "掃除担当", comment: "窓掃除が得意です" },
                { name: "宮城仙斗", role: "洗濯担当", comment: "柔軟剤を頻繁に変えます" },
                { name: "愛知名古郎", role: "育児担当", comment: "子どもの気持ちが分かります" },
                { name: "沖縄那覇美", role: "買い出し担当", comment: "セールの時間を狙います" },
            ];

            const memberList = document.getElementById("memberList");

            members.forEach((member) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-lg shadow-lg";

                card.innerHTML = `
                <h2 class="text-xl font-bold mt-4 ml-10">${member.name}</h2>
                <p class="font-bold text-blue-600 text-md mt-2 ml-8">${member.role}</p>
                <p class="text-gray-600 text-sm ml-8 mb-4">${member.comment}</p>
                `;

            memberList.appendChild(card);
            })
        </script>
    </body>

</html>
